          document.documentElement.lang = lang;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute('content', dark ? '#0B120F' : '#0E7C5A');

          /* storage unavailable — defaults apply */

      })();
